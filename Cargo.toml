[package]
name = "keyboard-matrix"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "keyboard-matrix"
test = false
bench = false

[dependencies]
cortex-m-rt = "0.7.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt", "usbd-hid"] }
heapless = "0.9.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
usbd-hid = "0.10.2"

[profile.release]
debug = 2
